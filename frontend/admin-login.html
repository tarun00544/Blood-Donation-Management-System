<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login · BLOODCARE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="auth-wrapper" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 70%, #334155 100%);">
  <div class="auth-card" style="border-top: 5px solid var(--primary);">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <span>🩸</span> BLOODCARE
      </a>
      <div style="display:inline-block; margin-bottom: 8px;">
        <span class="badge badge-danger" style="font-size:11px; text-transform:uppercase; letter-spacing:1px;">
          🛡️ Authorized Personnel Only
        </span>
      </div>
      <h2 class="auth-title">Administrative Portal</h2>
      <p class="auth-subtitle">Hospital blood bank & system supervisor access console.</p>
    </div>

    <form id="adminLoginForm" novalidate>
      <div id="adminAlert" style="display:none; margin-bottom: 16px;"></div>

      <div class="form-group">
        <label class="form-label" for="adminEmail">Administrator Email <span class="required">*</span></label>
        <input type="email" id="adminEmail" class="form-control" placeholder="admin@bloodcare.com" required autocomplete="email">
        <div class="form-error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="adminPassword">Password <span class="required">*</span></label>
        <div class="pwd-wrapper">
          <input type="password" id="adminPassword" class="form-control" placeholder="Enter admin password" required autocomplete="current-password">
        </div>
        <div class="form-error" id="passwordError"></div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px; background: var(--charcoal); border-color: #334155;">
        🔒 Authenticate & Access Admin Console
      </button>
    </form>

    <div class="auth-footer">
      <div style="font-size: 12px; color: var(--text-muted);">
        Default admin credentials: <br><code>admin@bloodcare.com</code> / <code>Admin@123</code>
      </div>
      <div style="margin-top: 14px;">
        <a href="user-login.html" style="font-size: 13px; font-weight: 600;">Switch to User Portal</a>
      </div>
      <div style="margin-top: 8px;">
        <a href="index.html" style="color: var(--text-muted); font-size: 12px;">&larr; Back to Home</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initPasswordToggle('#adminPassword', '.pwd-toggle-btn');

    const form = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('adminAlert');
    const submitBtn = document.getElementById('submitBtn');

    // Auto-check if already logged in as admin
    (async () => {
      const user = await auth.checkSession();
      if (user && user.role === 'admin') {
        window.location.href = 'admin/dashboard.html';
      }
    })();

    form.onsubmit = async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      let valid = true;
      if (!email) {
        document.getElementById('emailError').textContent = 'Admin email is required';
        valid = false;
      }
      if (!password) {
        document.getElementById('passwordError').textContent = 'Password is required';
        valid = false;
      }

      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying admin credentials...';

      try {
        const res = await api.post('/auth/admin-login', { email, password });
        toast('Admin authentication successful! Access granted.', 'success');
        setTimeout(() => {
          window.location.href = 'admin/dashboard.html';
        }, 400);
      } catch (err) {
        alertBox.className = 'alert-banner alert-danger';
        alertBox.innerHTML = `<span>⚠</span> <span>${esc(err.message)}</span>`;
        alertBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.textContent = '🔒 Authenticate & Access Admin Console';
      }
    };
  </script>
</body>
</html>
