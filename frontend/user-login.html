<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login · BLOODCARE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <span>🩸</span> BLOODCARE
      </a>
      <h2 class="auth-title">User Portal Login</h2>
      <p class="auth-subtitle">Welcome back! Sign in to manage your donor profile and blood requests.</p>
    </div>

    <form id="userLoginForm" novalidate>
      <div id="loginAlert" style="display:none; margin-bottom: 16px;"></div>

      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address <span class="required">*</span></label>
        <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
        <div class="form-error" id="emailError"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password <span class="required">*</span></label>
        <div class="pwd-wrapper">
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <div class="form-error" id="passwordError"></div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; font-weight: normal;">
          <input type="checkbox" id="rememberMe" style="width: auto;"> Remember me
        </label>
        <a href="register.html" style="color: var(--primary); font-weight: 600;">Create new account</a>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
        Sign In to User Portal
      </button>
    </form>

    <div class="auth-footer">
      <div>New to BLOODCARE? <a href="register.html" style="font-weight: 700;">Register as Donor / Recipient</a></div>
      <div style="margin-top: 12px; font-size: 12px;">
        Hospital Staff or Admin? <a href="admin-login.html" style="color: var(--text-secondary); text-decoration: underline;">Admin Portal Login</a>
      </div>
      <div style="margin-top: 10px;">
        <a href="index.html" style="color: var(--text-muted); font-size: 12px;">&larr; Back to Home</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initPasswordToggle('#loginPassword', '.pwd-toggle-btn');

    const form = document.getElementById('userLoginForm');
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('submitBtn');

    // Auto-check if already logged in as user
    (async () => {
      const user = await auth.checkSession();
      if (user && user.role === 'user') {
        window.location.href = 'user/dashboard.html';
      }
    })();

    form.onsubmit = async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      let valid = true;
      if (!email) {
        document.getElementById('emailError').textContent = 'Email is required';
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailError').textContent = 'Please enter a valid email address';
        valid = false;
      }
      if (!password) {
        document.getElementById('passwordError').textContent = 'Password is required';
        valid = false;
      }

      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const res = await api.post('/auth/login', { email, password });
        toast(res.message || 'Login successful!', 'success');
        setTimeout(() => {
          if (res.data && res.data.role === 'admin') {
            window.location.href = 'admin/dashboard.html';
          } else {
            window.location.href = 'user/dashboard.html';
          }
        }, 400);
      } catch (err) {
        alertBox.className = 'alert-banner alert-danger';
        alertBox.innerHTML = `<span>⚠</span> <span>${esc(err.message)}</span>`;
        alertBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to User Portal';
      }
    };
  </script>
</body>
</html>
