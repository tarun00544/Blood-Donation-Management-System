<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Blood Donors · BLOODCARE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-portal="user" data-page-title="Find Blood Donors">
  <div id="pageContent">
    <div class="card">
      <div class="card-header">
        <div>
          <h3 class="card-title">🔍 Search Registered Blood Donors</h3>
          <p style="margin:4px 0 0; font-size:13px; color:var(--text-muted);">
            Locate voluntary donors filtered by blood group, locality, and medical donation eligibility.
          </p>
        </div>
      </div>

      <!-- Filter Bar -->
      <form id="donorSearchForm" style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;">
        <div style="flex:1; min-width:160px;">
          <select id="filterBloodGroup" class="form-control">
            <option value="">All Blood Groups</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>

        <div style="flex:2; min-width:200px;">
          <input type="text" id="filterLocation" class="form-control" placeholder="Search by city, town or state...">
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; margin:0;">
            <input type="checkbox" id="filterEligibleOnly" style="width:auto;"> Eligible Only (&gt;90 days)
          </label>
        </div>

        <div>
          <button type="submit" class="btn btn-primary" style="height:42px;">
            🔍 Search Donors
          </button>
        </div>
      </form>

      <!-- Results Table -->
      <div id="resultsContainer">
        <div class="state-box">
          <div class="spinner"></div>
          Loading blood donors...
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    async function searchDonors() {
      const group = document.getElementById('filterBloodGroup').value;
      const location = document.getElementById('filterLocation').value.trim();
      const eligible = document.getElementById('filterEligibleOnly').checked;
      const box = document.getElementById('resultsContainer');

      box.innerHTML = '<div class="state-box"><div class="spinner"></div>Searching donors...</div>';

      try {
        let endpoint = '/donors?';
        const params = [];
        if (group) params.push(`blood_group=${encodeURIComponent(group)}`);
        if (location) params.push(`location=${encodeURIComponent(location)}`);
        if (eligible) params.push('eligible=true');
        endpoint += params.join('&');

        const res = await api.get(endpoint);
        const donors = res.data || [];

        if (!donors.length) {
          box.innerHTML = `
            <div class="state-box">
              <p>No matching donors found for the selected criteria.</p>
              <div style="font-size:13px; color:var(--text-muted);">Try selecting "All Blood Groups" or clearing the location filter.</div>
            </div>
          `;
          return;
        }

        box.innerHTML = `
          <div style="margin-bottom:12px; font-size:13px; color:var(--text-muted);">
            Showing <b>${donors.length}</b> registered donor(s):
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Donor Name</th>
                  <th>Blood Group</th>
                  <th>Location</th>
                  <th>Phone / Contact</th>
                  <th>Last Donation</th>
                  <th>Eligibility</th>
                  <th>Availability</th>
                </tr>
              </thead>
              <tbody>
                ${donors.map(d => `
                  <tr>
                    <td><b>${esc(d.name)}</b></td>
                    <td>${badge(d.blood_group, 'red')}</td>
                    <td>${esc(d.location || '—')}</td>
                    <td>
                      <a href="tel:${esc(d.phone || '')}" style="font-weight:600; color:var(--primary);">
                        📞 ${esc(d.phone || '—')}
                      </a>
                    </td>
                    <td>${fmtDate(d.last_donation_date)}</td>
                    <td>${d.eligible ? badge('Eligible Now', 'success') : badge('Resting Period', 'warning')}</td>
                    <td>${d.is_available === 0 || d.is_available === false ? badge('Unavailable', 'secondary') : badge('Available', 'success')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        box.innerHTML = `<div class="state-box" style="color:var(--danger)">${esc(err.message)}</div>`;
      }
    }

    document.getElementById('donorSearchForm').onsubmit = (e) => {
      e.preventDefault();
      searchDonors();
    };

    document.addEventListener('DOMContentLoaded', searchDonors);
  </script>
</body>
</html>
