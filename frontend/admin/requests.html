<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Requests & Issuance · BLOODCARE Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-portal="admin" data-page-title="Blood Request Management">
  <div id="pageContent">
    <div class="card">
      <div class="card-header">
        <div>
          <h3 class="card-title">📋 Blood Requisitions & Hospital Issue Console</h3>
          <p style="margin:4px 0 0; font-size:13px; color:var(--text-muted);">
            Evaluate requisitions, verify stock availability, approve/reject requests, and execute safe transactional blood unit issuance.
          </p>
        </div>
        <button id="refreshReqsBtn" class="btn btn-outline btn-sm">🔄 Refresh Requisitions</button>
      </div>

      <!-- Filters -->
      <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;">
        <div style="flex:1; min-width:140px;">
          <select id="statusFilter" class="form-control">
            <option value="">All Statuses</option>
            <option value="Pending">Pending Review</option>
            <option value="Approved">Approved (Ready to Issue)</option>
            <option value="Fulfilled">Fulfilled (Issued)</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>

        <div style="flex:1; min-width:140px;">
          <select id="groupFilter" class="form-control">
            <option value="">All Blood Groups</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
          </select>
        </div>

        <div style="flex:2; min-width:200px;">
          <select id="hospFilter" class="form-control">
            <option value="">All Hospitals</option>
          </select>
        </div>
      </div>

      <div id="requestsTableBox">
        <div class="state-box"><div class="spinner"></div>Loading blood requests...</div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script>
    let requestsList = [];
    let hospitalsList = [];

    async function loadRequests() {
      const box = document.getElementById('requestsTableBox');
      box.innerHTML = '<div class="state-box"><div class="spinner"></div>Loading requests...</div>';

      try {
        const status = document.getElementById('statusFilter').value;
        const group = document.getElementById('groupFilter').value;
        const hosp = document.getElementById('hospFilter').value;

        let q = '/blood-requests?';
        const params = [];
        if (status) params.push(`status=${encodeURIComponent(status)}`);
        if (group) params.push(`blood_group=${encodeURIComponent(group)}`);
        if (hosp) params.push(`hospital_id=${encodeURIComponent(hosp)}`);
        q += params.join('&');

        const [reqRes, hospRes] = await Promise.all([
          api.get(q),
          hospitalsList.length ? Promise.resolve({ data: hospitalsList }) : api.get('/hospitals')
        ]);

        requestsList = reqRes.data || [];
        hospitalsList = hospRes.data || [];

        const hSelect = document.getElementById('hospFilter');
        if (hSelect.options.length <= 1) {
          hSelect.innerHTML = '<option value="">All Hospitals</option>' +
            hospitalsList.map(h => `<option value="${h.hospital_id}">${esc(h.name)}</option>`).join('');
        }

        renderRequests();
      } catch (err) {
        box.innerHTML = `<div class="state-box" style="color:var(--danger)">${esc(err.message)}</div>`;
      }
    }

    function renderRequests() {
      const box = document.getElementById('requestsTableBox');
      if (!requestsList.length) {
        box.innerHTML = '<div class="state-box">No blood requests found matching the filters.</div>';
        return;
      }

      box.innerHTML = `
        <div style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">
          Showing <b>${requestsList.length}</b> request(s):
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Req #</th>
                <th>Patient / Recipient</th>
                <th>Blood Group</th>
                <th>Units Required</th>
                <th>Hospital</th>
                <th>Submission Date</th>
                <th>Status</th>
                <th>Actions & Issuance</th>
              </tr>
            </thead>
            <tbody>
              ${requestsList.map(r => `
                <tr>
                  <td>#${r.request_id}</td>
                  <td><b>${esc(r.recipient_name || 'Patient')}</b></td>
                  <td>${badge(r.blood_group, 'red')}</td>
                  <td><b>${r.units_required}</b> unit(s)</td>
                  <td>${esc(r.hospital_name || 'Hospital #' + r.hospital_id)}</td>
                  <td>${fmtDateTime(r.request_date)}</td>
                  <td>${badge(r.status)}</td>
                  <td style="white-space:nowrap;">
                    ${r.status === 'Pending' ? `
                      <button class="btn btn-primary btn-sm" onclick="updateStatus(${r.request_id}, 'Approved')">Approve</button>
                      <button class="btn btn-outline btn-sm" onclick="updateStatus(${r.request_id}, 'Rejected')">Reject</button>
                    ` : ''}

                    ${r.status === 'Approved' ? `
                      <button class="btn btn-success btn-sm" style="font-weight:700;" onclick="issueBloodUnits(${r.request_id})">
                        💉 Issue Blood Units
                      </button>
                      <button class="btn btn-outline btn-sm" onclick="updateStatus(${r.request_id}, 'Rejected')">Reject</button>
                    ` : ''}

                    ${r.status === 'Fulfilled' ? `
                      <span class="badge badge-success">✓ Issued & Closed</span>
                    ` : ''}

                    ${r.status === 'Rejected' ? `
                      <span class="badge badge-danger">Rejected</span>
                    ` : ''}

                    <button class="btn btn-outline btn-sm" style="margin-left:4px;" onclick="viewRequestDetails(${r.request_id})">
                      Details
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    window.updateStatus = async (id, newStatus) => {
      const modal = openModal(`Confirm Request ${newStatus}`, `
        <p>Are you sure you want to change Blood Request <b>#${id}</b> to <b>${newStatus}</b>?</p>
        <div class="modal-footer" style="margin:-24px -24px -24px -24px; margin-top:20px;">
          <button type="button" class="btn btn-secondary" data-close>Cancel</button>
          <button type="button" id="confirmStatusBtn" class="btn btn-primary">Confirm</button>
        </div>
      `);
      modal.querySelector('#confirmStatusBtn').onclick = async () => {
        try {
          await api.put(`/blood-requests/${id}`, { status: newStatus });
          toast(`Request #${id} marked as ${newStatus}`, 'success');
          modal.remove();
          loadRequests();
        } catch (err) {
          toast(err.message, 'error');
        }
      };
    };

    window.issueBloodUnits = (id) => {
      const r = requestsList.find(x => x.request_id === id);
      if (!r) return;

      const modal = openModal(`Issue Blood for Request #${id}`, `
        <p>You are about to issue <b>${r.units_required} unit(s)</b> of <b>${esc(r.blood_group)}</b> for patient <b>${esc(r.recipient_name || 'Patient')}</b> at <b>${esc(r.hospital_name)}</b>.</p>
        <div class="alert-banner alert-info" style="margin:14px 0;">
          <span class="alert-icon">💉</span>
          <div class="alert-content" style="font-size:12px;">
            The backend transaction will deduct available non-expired units using FIFO order and mark the request as <b>Fulfilled</b>.
            Stock will never be allowed to go negative.
          </div>
        </div>
        <div class="modal-footer" style="margin:-24px -24px -24px -24px; margin-top:20px;">
          <button type="button" class="btn btn-secondary" data-close>Cancel</button>
          <button type="button" id="executeIssueBtn" class="btn btn-success" style="font-weight:700;">Execute Issue</button>
        </div>
      `);

      modal.querySelector('#executeIssueBtn').onclick = async () => {
        const btn = modal.querySelector('#executeIssueBtn');
        btn.disabled = true;
        btn.textContent = 'Issuing blood...';

        try {
          const res = await api.post(`/blood-requests/${id}/issue`);
          const issuedData = res.data || {};
          modal.remove();

          const batchesUsed = (issuedData.stock_batches_used || []).map(b =>
            `<li>Batch #${b.stock_id}: <b>${b.units_taken} unit(s)</b> deducted (Expiry: ${fmtDate(b.expiry_date)})</li>`
          ).join('');

          openModal('Blood Issued Successfully! ✓', `
            <div class="alert-banner alert-success" style="margin:0 0 16px 0;">
              <span class="alert-icon">✓</span>
              <div class="alert-content">
                <b>${issuedData.units_issued || r.units_required} unit(s)</b> of ${esc(r.blood_group)} blood successfully issued.
              </div>
            </div>
            <h4 style="font-size:14px; margin-bottom:8px;">Batches Allocated:</h4>
            <ul style="font-size:13px; line-height:1.7; padding-left:18px;">${batchesUsed || '<li>Stock updated successfully</li>'}</ul>
            <div class="modal-footer" style="margin:-24px -24px -24px -24px; margin-top:20px;">
              <button type="button" class="btn btn-primary" data-close>Done</button>
            </div>
          `);

          loadRequests();
        } catch (err) {
          toast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Execute Issue';
        }
      };
    };

    window.viewRequestDetails = (id) => {
      const r = requestsList.find(x => x.request_id === id);
      if (!r) return;

      openModal(`Request #${r.request_id} Full Record`, `
        <div class="detail-list">
          <div class="detail-label">Request ID</div>
          <div class="detail-value">#${r.request_id}</div>

          <div class="detail-label">Status</div>
          <div class="detail-value">${badge(r.status)}</div>

          <div class="detail-label">Patient Name</div>
          <div class="detail-value"><b>${esc(r.recipient_name || '—')}</b></div>

          <div class="detail-label">Blood Group</div>
          <div class="detail-value">${badge(r.blood_group, 'red')}</div>

          <div class="detail-label">Units Required</div>
          <div class="detail-value"><b>${r.units_required}</b> unit(s)</div>

          <div class="detail-label">Hospital Blood Bank</div>
          <div class="detail-value">${esc(r.hospital_name || 'Hospital')}</div>

          <div class="detail-label">Submission Date</div>
          <div class="detail-value">${fmtDateTime(r.request_date)}</div>
        </div>
      `);
    };

    document.getElementById('statusFilter').onchange = loadRequests;
    document.getElementById('groupFilter').onchange = loadRequests;
    document.getElementById('hospFilter').onchange = loadRequests;
    document.getElementById('refreshReqsBtn').onclick = loadRequests;

    document.addEventListener('DOMContentLoaded', loadRequests);
  </script>
</body>
</html>
